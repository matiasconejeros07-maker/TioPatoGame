name: Pruebas V2
on:
  push:
    branches: [main]
    paths: ['v2/**', '.github/workflows/v2.yml']
  pull_request:
    paths: ['v2/**', '.github/workflows/v2.yml']
jobs:
  v2:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar
        working-directory: v2
        run: npm ci --no-audit --no-fund
      - name: App, servidor y migración (modelos, controladores, API contra PostgreSQL)
        working-directory: v2
        run: npm test
      - name: El juego completo en modo API (navegador real contra la API y PostgreSQL)
        working-directory: v2/server
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium
          node testing/juego-nube.e2e.mjs
      - name: El catálogo del servidor (shared/tienda-datos.js) está al día con juego/tienda.js
        working-directory: v2
        run: node shared/generar-tienda.mjs --check
      - name: El Worker de Cloudflare empaqueta
        working-directory: v2/server
        run: npx wrangler deploy --dry-run --outdir /tmp/worker
      - name: El juego V2 (v2.js y fondos-worker.js) está construido desde v2/*.js
        working-directory: v2/juego
        run: |
          node build-demo.mjs
          git diff --exit-code v2.js fondos-worker.js
